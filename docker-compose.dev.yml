# Development override — adds a local Headscale instance.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# In production, remove this file and point HEADSCALE_URL to your existing instance.
#
# Includes NO_PROXY overrides for environments with a corporate HTTP proxy injected
# by the Docker daemon (e.g. http://192.168.1.12:3128).

x-no-proxy: &no-proxy
  NO_PROXY: "headscale,tailui-backend,tailui-frontend,localhost,127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,.hs-net"
  no_proxy: "headscale,tailui-backend,tailui-frontend,localhost,127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,.hs-net"

services:
  headscale:
    image: headscale/headscale:0.23.0
    container_name: tailui-headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml
      - headscale-data:/var/lib/headscale
    networks:
      - hs-net
    ports:
      - "8080:8080"
    environment:
      <<: *no-proxy
    healthcheck:
      test: ["CMD", "headscale", "version"]
      interval: 5s
      timeout: 5s
      retries: 6

  tailui-backend:
    depends_on:
      headscale:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      <<: *no-proxy

  tailui-frontend:
    ports:
      - "5173:80"
    environment:
      <<: *no-proxy

volumes:
  headscale-data:

# Override: make hs-net a local network (not external) for dev
networks:
  hs-net:
    external: false
    name: hs-net
