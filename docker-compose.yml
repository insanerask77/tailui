services:
  tailui-backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      HEADSCALE_CONFIG_PATH: /etc/headscale/config.yaml
      DB_PATH: /app/data/tailui.db
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml
      - tailui-db:/app/data
    networks:
      - hs-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.4"

  tailui-frontend:
    build: ./frontend
    restart: unless-stopped
    networks:
      - hs-net
    depends_on:
      tailui-backend:
        condition: service_healthy
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.2"

networks:
  hs-net:
    external: true

volumes:
  tailui-db:
