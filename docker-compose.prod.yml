# Production overlay — adds Caddy reverse proxy with automatic HTTPS.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.prod.yml up -d
#
# Requires:
#   - ./Caddyfile  (generated by setup.sh)
#   - HEADSCALE_DOMAIN, TAILUI_DOMAIN, ACME_EMAIL  in .env

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - hs-net
    depends_on:
      - tailui-frontend
      - headscale

  # Expose WireGuard port for direct peer connections (bypasses DERP relay)
  headscale:
    ports:
      - "41641:41641/udp"
      - "3478:3478/udp"

  # Remove direct exposure — Caddy handles public traffic
  tailui-frontend:
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
